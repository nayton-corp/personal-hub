[project]
name = "personal-hub"
version = "0.13.10"
description = "Personal Hub : registre financier personnel, auto-hébergé"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.1",
    "fastapi==0.162.0",
    "lxml>=6.1.3",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "pyrage==1.4.0",
    "python-ulid==4.0.1",
    "pyyaml==6.0.3",
    "sqlalchemy==2.1.6",
    "structlog==26.1.0",
    "typer==0.27.3",
    "tzdata==2026.5",
    "uvicorn==0.54.0",
    "webauthn==3.0.1",
]

[project.optional-dependencies]
# conteneurs collecteurs seulement (image Playwright) ; l'image du hub n'en a pas besoin
collectors = [
    "cryptography==50.0.2",
    "embit==0.8.0",
    "playwright==1.63.0",
]

[project.scripts]
hub = "hub.cli:main"
hub-collector = "hub.collectors.cli:main"
hub-brain = "hub.brain.cli:main"

[project.entry-points."hub.domains"]
finance = "hub.domains.finance:create"
agenda = "hub.domains.agenda:create"
documents = "hub.domains.documents:create"

# ce que la finance apporte au cœur sans qu'il l'importe (chantier S1)
[project.entry-points."hub.connectors"]
finance = "hub.domains.finance.sources.app.connectors:CATALOG"

[project.entry-points."hub.country_modules"]
finance = "hub.domains.finance.sources.app.connectors:COUNTRY_MODULES"

[project.entry-points."hub.connection_imports"]
finance = "hub.domains.finance.sources.app.legacy_connections:import_legacy"

[dependency-groups]
dev = [
    "cbor2==6.1.5",
    "cryptography==50.0.2",
    "embit==0.8.0",
    "httpx==0.28.1",
    "hypothesis==6.170.12",
    "import-linter==2.15",
    "lxml-stubs>=0.5.1",
    "mypy==2.4.0",
    "playwright==1.63.0",
    "pre-commit==4.7.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.3",
    "types-pyyaml==6.0.12.20260906",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hub"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["hub/web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "TID", "RUF", "SIM", "PT", "DTZ"]
ignore = ["RUF001", "RUF002", "RUF003"]  # textes en français : apostrophes et espaces typographiques

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106", "S608", "DTZ001"]
"hub/core/migrations/**" = ["E501"]
# pages HTML et lignes CSV factices des tests de collecteurs
"tests/collectors/fakebank.py" = ["E501"]
"tests/finance/test_revolut.py" = ["E501"]
# fixtures du registre d'un an, importées de test_app_reads (le paramètre redéfinit le nom)
"tests/{brain/test_*,finance/test_tools,finance/test_sentinels}.py" = ["F811"]
"hub/domains/*/migrations/**" = ["E501"]
# SQL assemblé à partir de noms de tables et de marques :n internes ; les valeurs restent liées
"hub/domains/finance/classement/app/categorize_kinds.py" = ["S608"]
"hub/domains/finance/classement/app/insights.py" = ["S608"]
"hub/domains/finance/classement/app/review.py" = ["S608"]
"hub/domains/finance/classement/app/rule_kinds.py" = ["S608"]
"hub/domains/finance/classement/app/totals.py" = ["S608"]
"hub/domains/finance/patrimoine/app/account_kinds.py" = ["S608"]
"hub/domains/finance/patrimoine/app/debt_kinds.py" = ["S608"]
"hub/domains/finance/patrimoine/app/holdings.py" = ["S608"]
"hub/domains/finance/registre/app/reads.py" = ["S608"]
"hub/domains/finance/sources/app/statements.py" = ["S608"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
packages = ["hub"]

[[tool.mypy.overrides]]
module = ["pyrage.*", "embit.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["migrations: tests de schéma et de migrations (section 9)"]
filterwarnings = ["error::DeprecationWarning:hub.*"]

[tool.coverage.run]
source = ["hub"]
omit = ["hub/core/migrations/env.py", "hub/domains/*/migrations/env.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\.$"]

[tool.importlinter]
root_package = "hub"
# vrai : les contrats ci-dessous interdisent aussi des bibliothèques (sqlalchemy, fastapi, typer)
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Étages : domaines → cœur → plateforme → noyau, jamais vers le haut"
type = "layers"
layers = ["hub.domains", "hub.core", "hub.platform", "hub.kernel"]

[[tool.importlinter.contracts]]
name = "Ni l'API ni la CLI n'importent un domaine : elles passent par le registre"
type = "forbidden"
source_modules = ["hub.kernel", "hub.platform", "hub.core", "hub.api", "hub.cli", "hub.cli_tokens", "hub.cli_inbox", "hub.cli_ops", "hub.cli_proposals"]
forbidden_modules = ["hub.domains", "hub.collectors", "hub.brain"]

[[tool.importlinter.contracts]]
name = "Les collecteurs ne voient ni les domaines ni l'API : ils déposent des fichiers et déclarent leurs runs"
type = "forbidden"
source_modules = ["hub.collectors"]
forbidden_modules = ["hub.domains", "hub.api", "hub.cli"]

[[tool.importlinter.contracts]]
name = "Le brain ne voit le hub que par son API : ni domaine, ni base, ni route"
type = "forbidden"
source_modules = ["hub.brain"]
forbidden_modules = ["hub.domains", "hub.api", "hub.cli", "hub.collectors", "hub.platform.db", "hub.core.coredb", "hub.core.proposals"]

[[tool.importlinter.contracts]]
name = "Les domaines sont indépendants entre eux (lecture croisée par public.py)"
type = "independence"
modules = ["hub.domains.*"]
ignore_imports = ["hub.domains.** -> hub.domains.*.public"]
unmatched_ignore_imports_alerting = "none"

# --- Architecture cible (chantier S0 du plan « Socle du hub ») ---------------------------------
# Les contrats suivants décrivent le découpage visé (noyau, plateforme, cœur, domaines en couches).
# Les écarts d'aujourd'hui sont listés dans `ignore_imports` : la liste ne peut que rétrécir
# (`unmatched_ignore_imports_alerting = "error"` refuse un écart qui n'existe plus). On n'y
# ajoute jamais une ligne : un nouvel écart se corrige dans le code.

[[tool.importlinter.contracts]]
name = "Noyau (hub.kernel) : pur, sans E/S ni autre module du hub"
type = "forbidden"
source_modules = ["hub.kernel"]
forbidden_modules = ["sqlalchemy", "alembic", "fastapi", "starlette", "typer", "httpx", "structlog", "pydantic", "pydantic_settings", "hub.platform", "hub.core", "hub.api", "hub.cli", "hub.domains", "hub.collectors", "hub.brain"]

[[tool.importlinter.contracts]]
name = "Plateforme (hub.platform) : bases, migrations, réglages, secrets, journaux, sans métier"
type = "forbidden"
source_modules = ["hub.platform"]
forbidden_modules = ["fastapi", "starlette", "typer", "hub.core", "hub.api", "hub.cli", "hub.domains", "hub.collectors", "hub.brain"]

[[tool.importlinter.contracts]]
name = "Le cœur n'importe ni FastAPI ni Typer : HTTP et ligne de commande sont des bords"
type = "forbidden"
source_modules = ["hub.core"]
forbidden_modules = ["fastapi", "starlette", "typer"]
ignore_imports = [
    "hub.core.auth -> fastapi",
    "hub.core.domain -> fastapi",
    "hub.core.domain -> typer",
    "hub.core.errors -> fastapi",
    "hub.core.errors -> starlette",
]
unmatched_ignore_imports_alerting = "error"

[[tool.importlinter.contracts]]
name = "Finance : le domaine, ses bords, puis les sous-contextes sources → patrimoine → classement → registre"
type = "layers"
layers = [
    "hub.domains.finance.domain",
    "hub.domains.finance.api : hub.domains.finance.cli : hub.domains.finance.tools : hub.domains.finance.handlers : hub.domains.finance.rebuild : hub.domains.finance.manifest : hub.domains.finance.public",
    "hub.domains.finance.port : hub.domains.finance.compare",
    "hub.domains.finance.sources",
    "hub.domains.finance.patrimoine",
    "hub.domains.finance.classement",
    "hub.domains.finance.registre",
]

[[tool.importlinter.contracts]]
name = "Finance : chaque sous-contexte en couches interface → app → infra → model, rien d'autre"
type = "layers"
containers = [
    "hub.domains.finance.registre",
    "hub.domains.finance.classement",
    "hub.domains.finance.patrimoine",
    "hub.domains.finance.sources",
]
layers = ["(interface)", "app", "(infra)", "(model)"]
exhaustive = true

[[tool.importlinter.contracts]]
name = "Finance : model est pur (ni SQL, ni HTTP, ni fichiers du cœur)"
type = "forbidden"
source_modules = ["hub.domains.finance.*.model"]
forbidden_modules = ["sqlalchemy", "fastapi", "starlette", "typer", "httpx", "hub.platform.db", "hub.core.coredb", "hub.core.proposals", "hub.domains.finance.*.app", "hub.domains.finance.*.infra", "hub.domains.finance.*.interface"]

[[tool.importlinter.contracts]]
name = "Finance : infra lit et écrit des formats et des fichiers, sans base ni HTTP"
type = "forbidden"
source_modules = ["hub.domains.finance.*.infra"]
forbidden_modules = ["sqlalchemy", "fastapi", "starlette", "typer", "hub.platform.db", "hub.domains.finance.*.app", "hub.domains.finance.*.interface"]

[[tool.importlinter.contracts]]
name = "Finance : app ne parle ni HTTP ni ligne de commande, et n'importe aucune interface"
type = "forbidden"
source_modules = ["hub.domains.finance.*.app"]
forbidden_modules = ["fastapi", "starlette", "typer", "hub.domains.finance.*.interface"]
# imports directs : le cœur porte encore FastAPI (contrat du cœur, liste d'écarts ci-dessus)
allow_indirect_imports = true
