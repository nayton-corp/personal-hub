# D'autres façons de dire chaque cas de cases.yaml : mêmes attentes, autre phrase. Une variante n'exige pas la voie
# rapide (le modèle peut la prendre), tout le reste du cas s'applique.
#
#   variants   tournures, registres, phrases orales, glissements de transcription (Whisper : « éteint » pour
#              « éteins », un début coupé, sans ponctuation) ; elles servent à corriger
#   control    les phrases de contrôle : jamais regardées pour corriger, seulement pour vérifier qu'une correction tient
#              sur des phrases qu'on n'a pas vues (`run.py --set control`)

f1:
  variants: ["tu peux allumer le salon s'il te plaît", "allume le salon stp", "lumière au salon"]
  control: ["vas-y allume dans le salon"]
f2:
  variants: ["éteint la chambre", "coupe la lumière de la chambre", "tu peux éteindre dans la chambre ?"]
  control: ["la chambre, éteins"]
f3:
  variants: ["mets le salon à 30 pour cent", "baisse le salon à 30 %"]
  control: ["salon trente pour cent"]
f4:
  variants: ["ferme la baie vitrée", "tu peux fermer la baie ?"]
  control: ["baisse complètement la baie"]
f5:
  variants: ["mets les stores du bureau à 40 %", "stores bureau 40 pour cent"]
  control: ["les stores du bureau à quarante"]
f6:
  variants: ["mets la chambre à 19 degrés", "19 degrés dans la chambre"]
  control: ["règle la chambre sur 19"]
f7:
  variants: ["éteint la télé", "coupe la télé", "tu peux éteindre la télévision ?"]
  control: ["la télé, éteins-la"]
f8:
  variants: ["passe en mode nuit", "on passe en nuit", "bonne nuit la maison"]
  control: ["mets la maison en nuit"]
f9:
  variants: ["je suis de retour", "c'est bon je suis rentré à la maison"]
  control: ["me revoilà"]
f10:
  variants: ["laisse le bureau allumé", "ne touche pas au bureau, garde-le allumé"]
  control: ["garde la lumière du bureau comme elle est"]

