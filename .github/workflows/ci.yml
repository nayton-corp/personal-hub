# Barrières de qualité (spécification, section 11) sur chaque pull request, et construction
# des images linux/arm64. Aucune donnée réelle : tous les tests utilisent des fixtures générées.
# Le workflow Release (tag vX.Y.Z) l'appelle avec `release: true` : mêmes barrières, puis il
# construit et publie lui-même les images.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ inputs.release && 'release' || 'ci' }}
  cancel-in-progress: ${{ !inputs.release }}

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: pdftotext pour les PDF VIAC
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y poppler-utils
      - name: Chromium pour les collecteurs (faux sites locaux, lot 5)
        run: uv run playwright install --with-deps chromium
      - name: Aucune donnée réelle dans le dépôt
        run: scripts/check_no_data.sh
      - name: Secrets (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 \
            detect --source /repo --redact --no-banner
      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Types (mypy --strict)
        run: uv run mypy
      - name: Isolation des domaines (import-linter)
        run: uv run lint-imports
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: App web (lint Biome, tests des modules)
        run: make web
      - name: Tests et couverture (dont l'app à 375 px dans Chromium)
        env:
          HUB_SCREENSHOTS: ${{ runner.temp }}/screens
        run: uv run pytest -q --cov=hub --cov-report=term --cov-fail-under=85
      - name: Captures de l'app (375 px, données fictives)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: captures-375px
          path: ${{ runner.temp }}/screens
          if-no-files-found: ignore
      - name: Migrations
        run: uv run pytest -q -m migrations
      - name: Migration depuis la version précédente (bases et relevé fictifs)
        run: scripts/upgrade_from_previous.sh
      - name: Version unique (pyproject, paquet, CHANGELOG)
        run: uv run python scripts/release.py check
      - name: Vulnérabilités connues des dépendances (pip-audit)
        run: make audit

  # l'assistant (assistant/, venu de Domia, S10) : un paquet à part, ses tests avec un faux
  # Domia et un modèle scripté, sans GPU ni macOS
  assistant:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: assistant/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: assistant (ruff, mypy)
        run: python -m ruff check . && python -m ruff format --check . && python -m mypy
      - name: assistant (pytest)
        run: python -m pytest -q
      - name: pont Rappels (pytest)
        working-directory: assistant/eventkit
        run: pip install -r requirements-dev.txt && python -m pytest -q

  image:
    runs-on: ubuntu-24.04
    needs: quality
    if: ${{ !inputs.release }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Image hub (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: hub
          platforms: linux/arm64
          push: false
          load: true
          tags: hub:ci
          cache-from: type=gha,scope=hub
          cache-to: type=gha,mode=max,scope=hub
      - name: Instance d'essai (données fictives, migration, verify, /api/health)
        run: deploy/trial.sh ci ci
      - name: Image web (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          platforms: linux/arm64
          push: false
          tags: hub-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Image collecteurs (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: collector
          platforms: linux/arm64
          push: false
          tags: hub-collector:ci
          cache-from: type=gha,scope=collector
          cache-to: type=gha,mode=max,scope=collector
      - name: Le compose reste valide
        run: |
          cp deploy/.env.example deploy/.env
          docker compose --env-file deploy/.env -f deploy/compose.yaml config --quiet
          docker compose --env-file deploy/.env -f deploy/compose.yaml --profile collectors config --quiet
