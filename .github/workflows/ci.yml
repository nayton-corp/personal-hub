# Barrières de qualité (spécification, section 11) sur chaque pull request, et construction
# des images linux/arm64. Aucune donnée réelle : tous les tests utilisent des fixtures générées.
# Le workflow Release (tag vX.Y.Z) l'appelle avec `release: true` : mêmes barrières, puis il
# construit et publie lui-même les images.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ inputs.release && 'release' || 'ci' }}
  cancel-in-progress: ${{ !inputs.release }}

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: pdftotext pour les PDF VIAC
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y poppler-utils
      - name: Chromium pour les collecteurs (faux sites locaux, lot 5)
        run: uv run playwright install --with-deps chromium
      - name: Aucune donnée réelle dans le dépôt
        run: scripts/check_no_data.sh
      - name: Secrets (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 \
            detect --source /repo --redact --no-banner
      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Types (mypy --strict)
        run: uv run mypy
      - name: Isolation des domaines (import-linter)
        run: uv run lint-imports
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: App web (lint Biome, tests des modules)
        run: make web
      - name: Tests et couverture (dont l'app à 375 px dans Chromium)
        env:
          HUB_SCREENSHOTS: ${{ runner.temp }}/screens
        # en parallèle sur les cœurs du runner (pytest-xdist) : ~2 min 30 au lieu de ~6
        run: uv run pytest -q -n auto --cov=hub --cov-report=term --cov-fail-under=85
      - name: Captures de l'app (375 px, données fictives)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: captures-375px
          path: ${{ runner.temp }}/screens
          if-no-files-found: ignore
      - name: Migrations
        run: uv run pytest -q -m migrations
      - name: Migration depuis la version précédente (bases et relevé fictifs)
        run: scripts/upgrade_from_previous.sh
      - name: Version unique (pyproject, paquet, CHANGELOG)
        run: uv run python scripts/release.py check
      - name: Vulnérabilités connues des dépendances (pip-audit)
        run: make audit

  # l'assistant (assistant/, venu de Domia, S10) : un paquet à part, ses tests avec un faux
  # Domia et un modèle scripté, sans GPU ni macOS
  assistant:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: assistant
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: assistant/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: le paquet du hub, pour les outils du hub
        run: pip install -e ..
      - name: assistant (ruff, mypy)
        run: python -m ruff check . && python -m ruff format --check . && python -m mypy
      - name: assistant (pytest)
        run: python -m pytest -q
      - name: pont Rappels (pytest)
        working-directory: assistant/eventkit
        run: pip install -r requirements-dev.txt && python -m pytest -q

  image:
    runs-on: ubuntu-24.04-arm  # arm64 natif, comme le Mac : pas d'émulation QEMU
    needs: quality
    if: ${{ !inputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image hub (linux/arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: hub
          platforms: linux/arm64
          push: false
          load: true
          tags: hub:ci
          cache-from: type=gha,scope=hub
          cache-to: type=gha,mode=max,scope=hub
      - name: Instance d'essai (données fictives, migration, verify, /api/health)
        run: deploy/trial.sh ci ci
      - name: Image web (linux/arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: web
          platforms: linux/arm64
          push: false
          load: true
          tags: hub-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Image collecteurs (linux/arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: collector
          platforms: linux/arm64
          push: false
          load: true
          tags: hub-collector:ci
          cache-from: type=gha,scope=collector
          cache-to: type=gha,mode=max,scope=collector
      # la même barrière que la release, avant le tag : une faille critique corrigeable
      # bloque la PR plutôt que de griller une version
      - name: Vulnérabilités des images (Trivy, critiques corrigeables)
        # chaque image est scannée, et chaque faille donne le chemin du paquet dans l'image
        run: |
          failed=0
          for image in hub:ci hub-web:ci hub-collector:ci; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
              image --scanners vuln --ignore-unfixed --severity CRITICAL --format json --quiet \
              "$image" > trivy.json
            found=$(jq -r '.Results[]? | .Target as $t | .Vulnerabilities[]?
              | "\(.VulnerabilityID) \(.PkgName) \(.InstalledVersion) -> \(.FixedVersion) (\(.PkgPath // $t))"' trivy.json)
            if [ -n "$found" ]; then
              echo "::error title=$image::failles critiques corrigeables"
              echo "$found"
              failed=1
            else
              echo "$image : aucune faille critique corrigeable"
            fi
          done
          exit "$failed"
      - name: Le compose reste valide
        run: |
          cp deploy/.env.example deploy/.env
          docker compose --env-file deploy/.env -f deploy/compose.yaml config --quiet
          docker compose --env-file deploy/.env -f deploy/compose.yaml --profile collectors config --quiet
