# Publication d'une version (chantier S13, D-012) : la fusion de la PR de version sur main.
# 1. la version de pyproject.toml n'a pas encore de tag : il est posé sur ce commit (un tag poussé
# à la main par `make tag` lance aussi ce workflow) ; le tag est égal à la version et le
# CHANGELOG a sa section ; 2. toutes les barrières de la CI : si la CI de main est déjà verte sur
# ce même commit, elle n'est pas rejouée (on attend sa fin si elle tourne encore) ; sinon elle est
# relancée ici ; 3. images linux/arm64 poussées sur GHCR, avec leur SBOM et leur provenance ;
# 4. analyse des vulnérabilités de chaque image ; 5. notes de version (la release GitHub).
# Le Pi voit cette release et l'installe seul (deploy/autoupdate.sh). Une fusion qui ne change
# pas la version ne publie rien : tous les jobs sont sautés.
name: Release

on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

# par commit : un tag poussé à la main et la fusion du même commit passent l'un après l'autre,
# le second voit la release du premier et ne publie rien
concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      go: ${{ steps.tag.outputs.go }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: tag
        name: Une version à publier ?
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)"
          fi
          # le commit du tag s'il existe (^{} : celui d'un tag annoté)
          at="$(git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}" | awk '{print $1}' | tail -1)"
          go=false
          if [ -z "$at" ]; then
            go=true
          elif [ "$at" = "$GITHUB_SHA" ] && ! gh release view "$tag" >/dev/null 2>&1; then
            go=true  # tag posé, release absente : premier passage, ou un passage relancé
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "$tag : publication $go"
      - if: steps.tag.outputs.go == 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
      - if: steps.tag.outputs.go == 'true'
        run: uv python install 3.12 && uv sync --frozen
      - name: Le tag est la version de pyproject.toml, et le CHANGELOG la décrit
        if: steps.tag.outputs.go == 'true'
        run: uv run python scripts/release.py check "${{ steps.tag.outputs.tag }}"
      - name: Le commit est sur main
        if: steps.tag.outputs.go == 'true'
        run: |
          git fetch --quiet origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Le tag, posé sur ce commit
        if: steps.tag.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if [ -z "$(git ls-remote origin "refs/tags/$TAG")" ]; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA"
          fi

  # la CI de main a-t-elle déjà validé ce commit ? « true » : verte ; « false » : pas de CI de
  # main pour ce commit, on la rejoue ; rouge : la release s'arrête
  main-ci:
    needs: version
    if: needs.version.outputs.go == 'true'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      green: ${{ steps.check.outputs.green }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for _ in $(seq 1 60); do
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&branch=main" \
              --jq '.workflow_runs | if length == 0 then "" else (sort_by(.created_at) | last | "\(.status) \(.conclusion)") end')
            if [ -z "$run" ]; then echo "green=false" >> "$GITHUB_OUTPUT"; exit 0; fi
            status=${run%% *}; conclusion=${run#* }
            if [ "$status" = completed ]; then
              if [ "$conclusion" = success ]; then echo "green=true" >> "$GITHUB_OUTPUT"; exit 0; fi
              echo "::error::la CI de main est $conclusion sur ce commit"; exit 1
            fi
            echo "CI de main : $status, on attend"; sleep 30
          done
          echo "::error::la CI de main ne se termine pas"; exit 1

  quality:
    needs: main-ci
    if: needs.main-ci.outputs.green != 'true'
    uses: ./.github/workflows/ci.yml
    with:
      release: true

  publish:
    needs: [version, main-ci, quality]
    if: ${{ !cancelled() && needs.main-ci.result == 'success' && (needs.quality.result == 'success' || needs.quality.result == 'skipped') }}
    # un runner arm64 natif : plus d'émulation QEMU, l'image collector se construit bien plus vite
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        target: [hub, web, collector]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.target }}
          tags: |
            type=semver,pattern=v{{version}},value=${{ needs.version.outputs.tag }}
            type=semver,pattern=v{{major}}.{{minor}},value=${{ needs.version.outputs.tag }}
          labels: |
            org.opencontainers.image.title=personal-hub ${{ matrix.target }}
      - id: build
        name: Image ${{ matrix.target }} (linux/arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          # « -2 » : nouveau cache (0.16.4 : une couche du cache du collecteur que ghcr ne sert
          # plus, HEAD 403 sur son blob, bloquait la publication)
          cache-from: type=gha,scope=${{ matrix.target }}-2
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-2
      - name: Vulnérabilités de l’image (Trivy, critiques corrigeables)
        env:
          IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.target }}@${{ steps.build.outputs.digest }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD \
            aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
            image --platform linux/arm64 --scanners vuln --ignore-unfixed \
            --severity HIGH,CRITICAL --format table "$IMAGE" | tee "trivy-${{ matrix.target }}.txt"
          docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD \
            aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
            image --platform linux/arm64 --scanners vuln --ignore-unfixed \
            --severity CRITICAL --exit-code 1 --quiet "$IMAGE"
      - name: Empreinte publiée
        run: echo "${{ matrix.target }}=${{ steps.build.outputs.digest }}" > "digest-${{ matrix.target }}.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: |
            digest-${{ matrix.target }}.txt
            trivy-${{ matrix.target }}.txt

  notes:
    needs: [version, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
      - name: Notes de version (CHANGELOG et empreintes des images)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          {
            python3 scripts/release.py notes "$TAG"
            echo
            echo "### Images (linux/arm64)"
            echo
            for f in digest-*.txt; do
              t="${f#digest-}"; t="${t%.txt}"
              echo "- \`ghcr.io/${GITHUB_REPOSITORY}/$t:$TAG\` · \`$(cut -d= -f2 "$f")\`"
            done
            echo
            echo "Le Pi l'installe seul dans les minutes qui suivent (deploy/autoupdate.sh, notification ntfy)."
          } > notes.md
          gh release create "$TAG" --verify-tag --title "$TAG" \
            --notes-file notes.md trivy-*.txt
