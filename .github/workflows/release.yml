# Publication d'une version (chantier S13) : un tag vX.Y.Z posé sur main par `make tag`.
# 1. le tag est égal à la version de pyproject.toml et le CHANGELOG a sa section ;
# 2. toutes les barrières de la CI : si la CI de main est déjà verte sur ce même commit, elle
# n'est pas rejouée (on attend sa fin si elle tourne encore) ; sinon elle est relancée ici ; 3. images linux/arm64 poussées sur GHCR, avec leur SBOM
# et leur provenance ; 4. analyse des vulnérabilités de chaque image ; 5. notes de version.
# Rien ne se déploie ici : le Mac tire l'image après un « oui déploie vX » (make deploy).
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.6"
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Le tag est la version de pyproject.toml, et le CHANGELOG la décrit
        run: uv run python scripts/release.py check "$GITHUB_REF_NAME"
      - name: Le tag est sur main
        run: |
          git fetch --quiet origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  # la CI de main a-t-elle déjà validé ce commit ? « true » : verte ; « false » : pas de CI de
  # main pour ce commit, on la rejoue ; rouge : la release s'arrête
  main-ci:
    needs: version
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      green: ${{ steps.check.outputs.green }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for _ in $(seq 1 60); do
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&branch=main" \
              --jq '.workflow_runs | if length == 0 then "" else (sort_by(.created_at) | last | "\(.status) \(.conclusion)") end')
            if [ -z "$run" ]; then echo "green=false" >> "$GITHUB_OUTPUT"; exit 0; fi
            status=${run%% *}; conclusion=${run#* }
            if [ "$status" = completed ]; then
              if [ "$conclusion" = success ]; then echo "green=true" >> "$GITHUB_OUTPUT"; exit 0; fi
              echo "::error::la CI de main est $conclusion sur ce commit"; exit 1
            fi
            echo "CI de main : $status, on attend"; sleep 30
          done
          echo "::error::la CI de main ne se termine pas"; exit 1

  quality:
    needs: main-ci
    if: needs.main-ci.outputs.green != 'true'
    uses: ./.github/workflows/ci.yml
    with:
      release: true

  publish:
    needs: [main-ci, quality]
    if: ${{ !cancelled() && needs.main-ci.result == 'success' && (needs.quality.result == 'success' || needs.quality.result == 'skipped') }}
    # un runner arm64 natif : plus d'émulation QEMU, l'image collector se construit bien plus vite
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        target: [hub, web, collector]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.target }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=personal-hub ${{ matrix.target }}
      - id: build
        name: Image ${{ matrix.target }} (linux/arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
      - name: Vulnérabilités de l’image (Trivy, critiques corrigeables)
        env:
          IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.target }}@${{ steps.build.outputs.digest }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD \
            aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
            image --platform linux/arm64 --scanners vuln --ignore-unfixed \
            --severity HIGH,CRITICAL --format table "$IMAGE" | tee "trivy-${{ matrix.target }}.txt"
          docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD \
            aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
            image --platform linux/arm64 --scanners vuln --ignore-unfixed \
            --severity CRITICAL --exit-code 1 --quiet "$IMAGE"
      - name: Empreinte publiée
        run: echo "${{ matrix.target }}=${{ steps.build.outputs.digest }}" > "digest-${{ matrix.target }}.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: |
            digest-${{ matrix.target }}.txt
            trivy-${{ matrix.target }}.txt

  notes:
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
      - name: Notes de version (CHANGELOG et empreintes des images)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            python3 scripts/release.py notes "$GITHUB_REF_NAME"
            echo
            echo "### Images (linux/arm64)"
            echo
            for f in digest-*.txt; do
              t="${f#digest-}"; t="${t%.txt}"
              echo "- \`ghcr.io/${GITHUB_REPOSITORY}/$t:$GITHUB_REF_NAME\` · \`$(cut -d= -f2 "$f")\`"
            done
            echo
            echo "Déployer : \`make deploy TAG=$GITHUB_REF_NAME\` sur le Mac, après « oui déploie $GITHUB_REF_NAME »."
          } > notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file notes.md trivy-*.txt
