# Une configuration par base : `uv run alembic -n core upgrade head`.
# La base finance ([finance]) arrive au lot 1. L'emplacement réel des bases vient des réglages
# (`paths.data`) ; `sqlalchemy.url` ne sert que de valeur par défaut en développement.

[core]
script_location = hub/core/migrations
sqlalchemy.url = sqlite:///./var/data/core.db

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
