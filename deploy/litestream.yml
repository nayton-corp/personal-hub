# Réplication continue vers le disque externe monté (HUB_REPLICA). Le second emplacement est
# couvert par restic (conteneur « scheduler »), qui sauvegarde aussi cette réplique.
# Écrit par `hub ops litestream` depuis le registre des domaines (chantier S7) : ne pas éditer.
dbs:
  - path: /srv/hub/data/core.db
    replica:
      type: file
      path: /replica/core.db
  - path: /srv/hub/data/agenda.db
    replica:
      type: file
      path: /replica/agenda.db
  - path: /srv/hub/data/documents.db
    replica:
      type: file
      path: /replica/documents.db
  - path: /srv/hub/data/finance.db
    replica:
      type: file
      path: /replica/finance.db
