# Réglages sans secret, embarqués dans l'image. Surcharge par variable d'environnement :
# HUB_<SECTION>__<CLÉ>, par exemple HUB_SERVER__PUBLIC_ORIGIN (posée par compose depuis .env).
log_level = "INFO"

[paths]
data = "/srv/hub/data"        # volume nommé « data » : jamais un dossier du Mac
inbox = "/srv/hub/inbox"      # dossier du Mac monté (~/PersonalHub/inbox)
archive = "/srv/hub/archive"
backup = "/srv/hub/backup"

[server]
bind = "0.0.0.0:8710"         # réseau compose « hub » seulement : aucun port publié
public_origin = "https://hub.example.ts.net"

[auth]
session_hours = 12

[collectors]                  # lot 5 : lu par les conteneurs collector-* seulement
api_url = "http://api:8710"   # réseau compose « hub »
home = "/var/lib/hub-collector"
# horaires : ceux du catalogue (hub/core/connectors.py, fuseau HUB_TZ) ; pour en changer un :
# schedules = { bcf = "30 7 * * 1-5" }   (Revolut : au plus 4 synchros par jour sans l'utilisateur)
# lot 6 : cours publics ; quotes = { "<ISIN>" = "<symbole Yahoo>" } pour les titres sans autre cours
[collectors.market]
currencies = ["EUR", "USD", "GBP"]
crypto = { BTC = "bitcoin", ETH = "ethereum", SOL = "solana", USDC = "usd-coin", USDT = "tether" }

# lot 7 : IA locale, lu par le conteneur « brain » seulement. Le modèle tourne en natif sur le Mac
# (Ollama, GPU) ; MLX : llm_url = "http://host.docker.internal:8080/v1" et model = le dépôt MLX.
[brain]
api_url = "http://api:8710"
llm_url = "http://host.docker.internal:11434/v1"
model = "qwen3:32b"
state_dir = "/srv/hub/brain"

[secrets]
file = "/srv/hub/config/secrets.enc.yaml"
age_key_file = "/run/secrets/age_key"
