# uv run pre-commit install — les mêmes barrières que la CI, avant chaque commit.
# gitleaks s'installe sur le Mac : brew install gitleaks
repos:
  - repo: local
    hooks:
      - id: check-no-data
        name: aucune donnée réelle (xml, pdf, db, csv, data/)
        entry: scripts/check_no_data.sh
        language: script
      - id: gitleaks
        name: gitleaks (secrets)
        entry: gitleaks protect --staged --redact --no-banner
        language: system
        pass_filenames: false
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy --strict
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: import-linter
        name: import-linter
        entry: uv run lint-imports
        language: system
        types: [python]
        pass_filenames: false
